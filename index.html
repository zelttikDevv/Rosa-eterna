<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Rosa Encantada</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="canvas">
        <div class="glow-bg"></div>

        <div class="glass-dome">
            <div class="reflection"></div>
        </div>

        <div class="rose">
            <div class="stem">
                <div class="thorn t1"></div>
                <div class="thorn t2"></div>
                <div class="leaf l1"></div>
                <div class="leaf l2"></div>
            </div>
            <div class="petals">
                <div class="petal center"></div>
                <div class="petal left"></div>
                <div class="petal right"></div>
                <div class="petal back-left"></div>
                <div class="petal back-right"></div>
            </div>
        </div>

        <div class="base"></div>

        <div class="sparks-container"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
