<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rosa Eterna CSS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="glass-dome"></div>
        <div class="base"></div>

        <div class="rose">
            <div class="petals">
                <div class="petal-center"></div>
                <div class="petal-left"></div>
                <div class="petal-right"></div>
            </div>
            <div class="stem">
                <div class="leaf leaf-left"></div>
                <div class="leaf leaf-right"></div>
            </div>
        </div>

        <div class="fallen-petals">
            <div class="fallen-petal-1"></div>
            <div class="fallen-petal-2"></div>
        </div>

        <div class="sparkles">
            <div class="sparkle s1"></div>
            <div class="sparkle s2"></div>
            <div class="sparkle s3"></div>
        </div>
    </div>
</body>
</html>
