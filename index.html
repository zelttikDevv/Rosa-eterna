<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Tulipán Encantado</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="canvas">
        <!-- Brillo de fondo nítido -->
        <div class="glow-bg"></div>

        <!-- Cúpula de Cristal -->
        <div class="glass-dome">
            <div class="reflection"></div>
        </div>

        <!-- El Tulipán (Posicionado al frente sin blur, con degradados 3D) -->
        <div class="flower-container">
            <div class="tulip">
                <!-- Tallo y hojas del tulipán con volumen dinámico -->
                <div class="stem"></div>
                <div class="leaf l1"></div>
                <div class="leaf l2"></div>
                
                <!-- Capullo del Tulipán -->
                <div class="tulip-head">
                    <div class="petal back-left"></div>
                    <div class="petal back-right"></div>
                    <div class="petal center-petal"></div>
                </div>
            </div>
        </div>

        <!-- Base de la cúpula -->
        <div class="base"></div>

        <!-- Contenedor para elementos dinámicos (pétalos y brillos) -->
        <div class="sparks-container"></div>
    </div>

    <!-- Frase romántica mejorada -->
    <div class="romantic-phrase">
        "Prometo amarte cada día, hasta que caiga el último pétalo de este tulipán eterno... Y aun así, mi amor sabrá encontrar la forma de volver a florecer."
    </div>

    <script src="script.js"></script>
</body>
</html>
