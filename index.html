<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rosa Eterna</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="scene">
        <div class="glow-core"></div>

        <div class="glass-dome"></div>

        <div class="rose-assembly">
            <div class="rose-buds">
                <div class="petal p-center"></div>
                <div class="petal p-left"></div>
                <div class="petal p-right"></div>
                <div class="petal p-bottom-left"></div>
                <div class="petal p-bottom-right"></div>
            </div>
            <div class="stem">
                <div class="leaf l-left"></div>
                <div class="leaf l-right"></div>
            </div>
        </div>

        <div class="falling-container" id="fallingContainer"></div>

        <div class="ground-petals">
            <div class="gp gp1"></div>
            <div class="gp gp2"></div>
            <div class="gp gp3"></div>
            <div class="gp gp4"></div>
        </div>

        <div class="sparkles-container">
            <div class="sparkle sp1"></div>
            <div class="sparkle sp2"></div>
            <div class="sparkle sp3"></div>
            <div class="sparkle sp4"></div>
        </div>

        <div class="base-container">
            <div class="flower-base"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
