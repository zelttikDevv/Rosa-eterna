<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rosa Eterna</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #030106;
            font-family: 'Georgia', serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        .interface {
            position: absolute;
            width: 100%;
            bottom: 8%;
            z-index: 10;
            text-align: center;
            color: #ffffff;
            pointer-events: none;
        }
        h1 {
            font-size: 1.6rem;
            font-weight: 300;
            letter-spacing: 3px;
            text-shadow: 0 0 15px rgba(255, 30, 100, 0.7);
            padding: 0 20px;
            margin: 0;
            animation: fadeInGlow 4s ease-in-out infinite alternate;
        }
        @keyframes fadeInGlow {
            from { opacity: 0.8; text-shadow: 0 0 10px rgba(255, 30, 100, 0.5); }
            to { opacity: 1; text-shadow: 0 0 25px rgba(255, 30, 100, 0.9); }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="interface">
        <h1>"El amor que siento por ti terminará cuando caiga el último pétalo de esta rosa."</h1>
    </div>

    <script src="rose.js"></script>
    <script src="particles.js"></script>
    <script src="scene.js"></script>
</body>
</html>
