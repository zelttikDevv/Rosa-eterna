<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amor Eterno</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="scene">

    <div class="ambient-glow"></div>

    <div class="dome">

        <div class="glass-highlight"></div>

        <div class="flower">

            <div class="stem"></div>

            <div class="leaf leaf-left"></div>
            <div class="leaf leaf-right"></div>

            <div class="bloom">

                <div class="petal petal-left"></div>
                <div class="petal petal-right"></div>
                <div class="petal petal-back"></div>
                <div class="petal petal-center"></div>

            </div>

        </div>

        <div id="particles"></div>

    </div>

    <div class="base"></div>

</div>

<div class="message">
    “Prometo amarte cada día, hasta que caiga el último pétalo de este tulipán eterno... Y aun así, mi amor sabrá encontrar la forma de volver a florecer.”
</div>

<div class="signature">
    Eventualmente todo lo que es para ti termina encontrándote.
</div>

<script src="script.js"></script>

</body>
</html>
